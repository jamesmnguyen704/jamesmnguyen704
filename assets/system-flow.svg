<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="System flow: exports to parsers to warehouse to matching to staged imports to human approval">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <style>.t{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.s{font:12px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.b{fill:#1e293b;stroke:#334155;stroke-width:1.5}.h{fill:#14532d;stroke:#4ade80;stroke-width:2}.w{fill:#312e81;stroke:#818cf8;stroke-width:2}</style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <text x="450" y="34" text-anchor="middle" class="t" style="font-size:16px">From messy exports to numbers you can trace</text>
  <g>
    <rect class="b" x="24"  y="78" width="118" height="70" rx="12"/><text x="83"  y="108" text-anchor="middle" class="t">Exports</text><text x="83"  y="128" text-anchor="middle" class="s">bank · books · docs</text>
    <rect class="b" x="170" y="78" width="118" height="70" rx="12"/><text x="229" y="108" text-anchor="middle" class="t">Parsers</text><text x="229" y="128" text-anchor="middle" class="s">source checks</text>
    <rect class="w" x="316" y="70" width="136" height="86" rx="14"/><text x="384" y="105" text-anchor="middle" class="t">Warehouse</text><text x="384" y="126" text-anchor="middle" class="s">one source of truth</text>
    <rect class="b" x="480" y="78" width="118" height="70" rx="12"/><text x="539" y="108" text-anchor="middle" class="t">Matching</text><text x="539" y="128" text-anchor="middle" class="s">explicit states</text>
    <rect class="b" x="626" y="78" width="118" height="70" rx="12"/><text x="685" y="108" text-anchor="middle" class="t">Staged</text><text x="685" y="128" text-anchor="middle" class="s">import files</text>
    <rect class="h" x="772" y="78" width="104" height="70" rx="12"/><text x="824" y="108" text-anchor="middle" class="t">Person</text><text x="824" y="128" text-anchor="middle" class="s">approves</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)" fill="none">
    <path d="M142,113 H168"/><path d="M288,113 H314"/><path d="M452,113 H478"/><path d="M598,113 H624"/><path d="M744,113 H770"/>
  </g>
  <path d="M384,156 V196 H684" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <rect class="b" x="560" y="196" width="250" height="44" rx="10"/><text x="685" y="223" text-anchor="middle" class="t">Reports · dashboards · exception queues</text>
  <text x="200" y="224" class="s">AI assistants work inside the same gates, never around them</text>
</svg>
